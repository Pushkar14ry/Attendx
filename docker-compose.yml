services:
  db:
    image: postgres:16-alpine
    container_name: attendx-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendx}
      POSTGRES_USER: ${POSTGRES_USER:-attendx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendx_pass}
    ports:
      - "5432:5432"
    volumes:
      - attendx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendx} -d ${POSTGRES_DB:-attendx}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: attendx-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-attendx}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-attendx}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-attendx_pass}
    ports:
      - "8080:8080"
    profiles: ["full"]

  pgadmin:
    image: dpage/pgadmin4
    container_name: attendx-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@attendx.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles: ["tools"]

volumes:
  attendx_pgdata:
